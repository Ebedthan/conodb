[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "conodb"
version = "0.2.0.dev0"
description = "Reproducible builder for the ConoDictor reference database (UniProt => regions => audit => profiles)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Anicet Ebou" }]
dependencies = [
    "pyopal>=0.7",
    "pyhmmer>=0.11",
    "pyfamsa>=0.5",
    "lightmotif>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
bayes = ["cmdstanpy>=1.2"]
test = ["pytest>=8"]

[project.scripts]
conodb = "conodb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conodb"]
artifacts = ["src/conodb/stan/*.stan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
