# Weekly check for a new UniProt release; rebuild the database and propose it as a PR.
# Repository layout: conodb at the repository root (pyproject.toml, conodb.toml,
# labels.tsv, src/, db/), as in the koualab conodb repository.
# Save as .github/workflows/update-db.yml
name: Update ConoDictor database

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC; UniProt releases about every 8 weeks
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the UniProt release is already built"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: conodb-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash -el {0}          # login shell, so the micromamba environment is active

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # pftools (pfsearch) is required: without it the PSSM features, which the
      # selected model uses, would be skipped and the release would differ from the paper's
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conodb
          create-args: python=3.12 pftools
          condarc: |
            channels: [conda-forge, bioconda]
            channel_priority: strict

      - name: Install conodb
        run: |
          pip install .
          pfsearch -v || { echo "pfsearch missing"; exit 1; }
          conodb --version || true

      - name: Is a new UniProt release available?
        id: check
        run: |
          set +e
          conodb check -c conodb.toml
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] || [ $code -eq 10 ] || exit $code

      - name: Build (Bayesian fit off on CI, it takes hours on a hosted runner)
        id: build
        if: steps.check.outputs.code == '10' || inputs.force
        run: |
          set +e
          sed -i 's/^bayes = .*/bayes = "false"/; s/^pssm = .*/pssm = "true"/' conodb.toml
          conodb run -c conodb.toml
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "release=$(cat db/LATEST 2>/dev/null)" >> "$GITHUB_OUTPUT"
          git checkout conodb.toml            # keep the CI-only settings out of the PR
          [ $code -eq 0 ] || [ $code -eq 2 ] || exit $code

      - name: Open a curation issue (new family labels)
        if: steps.build.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="conodb: new UniProt family labels need curation"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" -gt 0 ] && { echo "Curation issue already open"; exit 0; }
          f=$(ls -t db/releases/*/unmapped_labels.tsv | head -1)
          {
            echo "UniProt introduced family labels that no rule or override covers."
            echo "Add them to \`labels.tsv\` (scope: conopeptide, other or exclude), then rerun this workflow."
            echo
            echo '```'
            cat "$f"
            echo '```'
          } > body.md
          gh issue create --title "$title" --body-file body.md

      - name: Upload the full release (raw download, clusters, FASTA)
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: conodb-${{ steps.build.outputs.release }}
          path: db/releases/${{ steps.build.outputs.release }}
          include-hidden-files: true
          retention-days: 90

      - name: Open a pull request with the summary tables and report
        if: steps.build.outputs.code == '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: conodb/update-${{ steps.build.outputs.release }}
          title: "Database update: UniProt ${{ steps.build.outputs.release }}"
          commit-message: "conodb: build UniProt ${{ steps.build.outputs.release }}"
          body-path: db/releases/${{ steps.build.outputs.release }}/report.md
          add-paths: db
